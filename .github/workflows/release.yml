name: Release

on:
  push:
    branches: [main]

# Nothing is granted by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Stage 1 — maintain the release PR. Every push to main updates a single
  # open PR that bumps the version in package.json and rewrites CHANGELOG.md
  # from the conventional commits since the last tag. Nothing is published
  # here; merging that PR is the human decision to cut a release.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Stage 2 — publish. Only reached by the push that merges the release PR,
  # because that is the only push where release-please tags a release and
  # sets `release_created`.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Check out the tag release-please just created, not the branch head.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Writes the .npmrc that points the scope at GitHub Packages and
          # reads the token from NODE_AUTH_TOKEN below.
          registry-url: https://npm.pkg.github.com
          scope: "@palebluebytes"

      # Last gate before the version becomes immutable. GitHub Packages does
      # not allow republishing a version, so a bad publish is permanent.
      - run: node --test "test/**/*.test.js"

      # --no-git-checks: the checkout above is a detached HEAD at the tag, and
      # pnpm otherwise refuses to publish from anything but a clean branch.
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
