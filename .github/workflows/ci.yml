name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package targets any JS runtime, so the floor matters more than
        # the ceiling. This must cover everything `engines` advertises — it
        # says >=22, so 22 is the floor here. See AGENTS.md.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # No install step: the package has zero runtime dependencies and the
      # tests need neither network nor credentials.
      - run: node --test "test/**/*.test.js"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Frozen: the lockfile pins the exact Prettier, so a patch release of it
      # can't turn this job red on a commit that didn't touch formatting.
      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prettier --check .
